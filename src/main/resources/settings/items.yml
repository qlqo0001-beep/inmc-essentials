# inmc-essentials — 아이템(items) 설정. /에센셜 리로드 로 다시 읽습니다.
# (CMI config.yml 의 Optimizations.Commands.Give/Clear · ItemRenaming · Optimizations.ItemName/ItemLore · ShulkerBoxes · Dye · search,
#  Settings/CustomHeads.yml 의 EntityHeads 에 해당)

give:
  # /지급 ** — 최근 이 날 안에 들어온 사람 전원(오프라인은 우편으로). 명령에 -d:<일> 을 붙이면 그 값. (CMI giveall offline)
  offline-days: 30
  # 한 번에 줄 수 있는 최대 개수(아이템 하나마다).
  max-amount: 2304
  # 여러 사람에게 줄 때 한 틱에 몇 명씩 — 서버가 멈추지 않게 나눠 줍니다.
  recipients-per-tick: 200
  # 받은 사람에게 알림(-s 를 붙이면 그 명령만 끔).
  notify-target: true

# 이름(/이름)·설명(/설명)·모루 이름 바꾸기 제한. 우회: inmcessentials.items.rename.bypass
naming:
  # 이름 최대 글자(색 빼고). 0 = 제한 없음. (CMI ItemRenaming.MaxLength)
  name-max-length: 64
  # 설명 한 줄 최대 글자(색 빼고). 0 = 제한 없음. (CMI Optimizations.ItemLore.MaxLength)
  lore-max-length: 64
  # /설명 을 쓸 수 없는 재질. (CMI ItemLore.TypeBlackList)
  lore-type-blacklist:
  - gold_nugget
  # 바꾼 아이템에 표식을 붙입니다(PDC inmcess:modified_name · inmcess:modified_lore). (CMI MarkChanged)
  mark-changed: false
  # true 면 아래 rules 에 걸리는 이름을 막습니다. (CMI ItemRenaming.Prevent)
  prevent: false
  # true 면 이름 바꾸기 자체를 막습니다(명령·모루). (CMI ItemRenaming.GlobalDisable)
  global-disable: false
  # 원래 이름도 검사합니다 — 규칙에 걸리는 이름을 가진 아이템은 다른 이름으로도 못 바꿉니다. (CMI CheckSource)
  check-source: true
  # '재질:정규식' — 정규식이 이름 전체와 맞으면 막습니다. 재질 자리에 * 는 전부. (CMI ItemRenaming.List)
  rules:
  - 'spawner:([A-z]+ (?i)\w*spawner)'
  # 모루 이름 바꾸기에도 위 제한을 겁니다. (CMI Modules anvilRename)
  anvil: true
  # 모루 이름에 색(& 코드 · MiniMessage)을 넣게 합니다 — inmcessentials.items.itemname.color 가 있는 사람만.
  anvil-colors: true
  # 모루로 색을 넣은 이름을 바닐라처럼 기울임꼴로 둡니다(글 안에서 <!i> 로 끌 수 있음). (CMI ItemRenaming.Anvil.ItalicByDefault)
  anvil-italic-by-default: true

# 셜커 상자 배낭 — 가방 안의 셜커 상자를 놓지 않고 엽니다. (CMI Modules shulkerBackpack · ShulkerBoxes)
shulker-backpack:
  enabled: true
  # true 면 가방에서 Shift+우클릭으로만 엽니다(그냥 우클릭은 바닐라대로 집기).
  shift-only: false
  # 손에 들고 허공을 우클릭해도 엽니다(블록을 보고 누르면 바닐라대로 놓습니다).
  open-from-hand: true
  # 전투 중(맞거나 때린 뒤 combat-seconds 초)에는 못 엽니다. (CMI PreventInCombat)
  prevent-in-combat: true
  # true 면 inmcessentials.items.shulker.edit 권한이 있어야 내용을 고칩니다(없으면 보기만). (CMI RequirePermission)
  require-edit-permission: false
  # 열 때마다 드는 돈(0 = 없음). 면제: inmcessentials.items.shulker.free (CMI CostToOpen)
  cost: 0.0
  # 돈의 화폐 id(비우면 기본 화폐).
  currency: ''
  # true 면 달리기·활공·탈것 중에는 못 열고, 연 채로 move-tolerance 블록 넘게 움직이면 닫습니다.
  prevent-while-moving: false
  move-tolerance: 1.5
  # 커스텀 아이템(inmc · MMOItems · ItemsAdder …)인 셜커 상자도 배낭으로 엽니다. 끄면(기본) 그 플러그인의 우클릭 능력·배낭을 건드리지 않습니다.
  allow-custom-items: false

clear:
  # 조건 없이 전부 비울 때 [확인] 을 한 번 더 누르게 합니다. (CMI Clear.Confirmation)
  confirm: true
  # 이것이 붙은 아이템은 지우지 않습니다. (CMI Clear.Exclude)
  # - 'NBT:<경로>' — 아이템의 custom_data 안 경로(CMI 와 같은 꼴, 예: 'NBT:ItemJoin Name' · 'NBT:ItemJoin.Name' — 점은 한 겹 아래)
  # - '<네임스페이스>:<이름>' — PDC 열쇠(예: 'inmcess:modified_name')
  exclude: []

dye:
  # 움직이는 색(무지개·낮밤·바이옴·체력 …)은 염색받은 사람이 입었을 때만 바뀝니다. (CMI Dye.BoundToPlayer)
  bound-to-player: false
  # 움직이는 색을 다시 칠하는 주기(초). 입은 갑옷만 봅니다.
  period-seconds: 1
  # 정의에 색이 있는 inmc 커스텀 아이템에도 움직이는 색을 허용합니다(그 아이템을 다시 그리면 정의의 색으로 돌아갑니다).
  allow-dynamic-on-colored-custom-items: false

search:
  # 결과를 이만큼까지 모읍니다.
  max-results: 2000
  # /검색 지우기 — 찾은 아이템을 접속 중인 사람에게서 지웁니다(확인 한 번 더). (CMI search.EnablePurge)
  enable-purge: false
  # 결과를 plugins/inmc-essentials/search/ 에 남깁니다. (CMI search.LogIntoFile)
  log-into-file: true
  page-size: 10

# 맞거나 때린 뒤 이 초 동안 '전투 중'(셜커 배낭 막기 · 염색 combat 모드).
combat-seconds: 10

