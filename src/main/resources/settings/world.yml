# inmc-essentials — 월드·날씨·시간·바이옴(world) 기능 설정. /에센셜 리로드 로 다시 읽는다.
# 값이 이상하면 기본값으로 돈다. 지운 키는 이 배포 파일의 값으로 돈다. 괄호 안은 옮겨 온 CMI 설정 키.
# 월드 이름은 대소문자를 가리지 않는다. /에센셜 가져오기 cmi 가 CMI config.yml 의 값을 여기에 옮겨 적는다.

# 월드별 제한(WorldLimits). 들어올 때(접속·월드 이동·부활)와 check-every 초마다 맞춘다.
# 우회 권한: inmcessentials.world.limit.gamemode.bypass · fly.bypass · god.bypass · elytra.bypass · aboveroof (기본 op)
limits:
  enabled: false
  check-every: 5
  # 월드: 게임모드(survival · creative · adventure · spectator)
  gamemode: {}
  # 비행 금지 월드(서바이벌·어드벤처만). 우리가 끈 비행은 제한 없는 월드로 나가면 돌려준다.
  no-fly: []
  # 무적 금지 월드 — player 기능의 /무적 을 끈다
  no-god: []
  # 겉날개 금지 월드(WorldLimits.ElytraFlight) — 활공을 막는다
  no-elytra: []
  # 겉날개 금지 월드에 들어오면 입은 겉날개를 가방으로 옮긴다(자리가 없으면 그대로 두고 활공만 막는다)
  elytra-unequip: true
  # false 면 아래 높이 위로는 권한(inmcessentials.world.limit.aboveroof)이 있는 사람만 난다(FlyAboveRoof)
  fly-above-roof: true
  roof:
    world: 320
    world_nether: 128
    world_the_end: 256
  # 월드: [막을 스폰 사유](SpawnReasons) — NATURAL · SPAWNER · TRIAL_SPAWNER · EGG · SPAWNER_EGG · BREEDING · NETHER_PORTAL · RAID · PATROL ·
  # VILLAGE_DEFENSE · BUILD_IRONGOLEM · REINFORCEMENTS · SLIME_SPLIT · COMMAND · CUSTOM(다른 플러그인이 띄운 것) … (Bukkit SpawnReason 이름)
  spawn-reasons: {}

# 잠자기 밤 가속(Sleeping.Speedup). 바닐라 playersSleepingPercentage(바로 넘기기)와 함께 돈다 — 둘 중 먼저 닿는 쪽.
sleep:
  enabled: true
  # 비우면 전부(정상 월드만)
  worlds: []
  # 밤(night-starts-at ~ 24000틱)에만 빨라진다(OnlyDurringNight)
  only-night: true
  night-starts-at: 12542
  # none · title · actionbar · bossbar
  info: title
  # 잠수인 사람은 인원에서 뺀다(ExcludeAfk). inmcessentials.world.sleep.ignore 권한·관전·투명인 사람도 빠진다.
  exclude-afk: true
  # 모두 자면 이 배속, 일부만 자면 그 비율만큼(BaseSpeed). 최소 배속(MinSpeed)
  base-speed: 100
  min-speed: 5
  # 이만큼 자야 빨라진다 — 사람 수(3) 또는 비율(50%)(MinBeforeSpeeding)
  min-sleeping: 50%
  # 이만큼 자면 바로 아침(0% = 끔)
  skip-at: 0%
  # 가속으로 아침이 되면 비·천둥을 걷는다(바닐라 넘기기와 같다)
  clear-weather: true
  # 누가 잠들면 그 월드에 "몇 명 더" 를 알린다(Inform) — inform-delay 초마다 한 번
  inform: true
  inform-delay: 30

# 네더 포탈 만들기(NetherPortal). 우회: inmcessentials.world.netherportal.bypass
nether-portal:
  prevent-creation: false
  # 바닐라 최대 23
  max-height: 23
  max-width: 23
  # 만들 때 행동 표시줄로 크기를 알린다
  show-size: true
  # 월드별 덮어쓰기 — 적지 않은 값은 위의 값
  worlds: {}
  #  world_nether:
  #    prevent-creation: true

# 몹이 탈것에 타는 것 막기(Optimizations.PreventEntityBoatEnter — 수레는 더한 것)
entity-vehicle:
  boats:
    monsters: false
    animals: false
    villagers: false
  minecarts:
    monsters: false
    animals: false
    villagers: false

# 시간(Time)
time:
  # /시간 낮 · /day 등 — 시각(13:00 · 1pm) 또는 틱(7000t). 이름을 더하면 /시간 <이름> 으로 쓴다(한글 이름은 따옴표).
  presets:
    day: '12:00'
    night: '24:00'
    morning: '06:00'
    dusk: '18:00'
  # -smooth 전환 속도(배속, SmoothSpeed) — 1초마다 이 × 20 틱씩 간다
  smooth-speed: 100
  # 현실 시간 맞추기(AutoTime) — 켜진 월드는 시간을 멈추고 interval 초마다 현실 시각으로 맞춘다. /시간 자동실제 시작|정지 가 worlds 를 고친다.
  auto-real:
    worlds: []
    interval: 60
    smooth: true
    # 비우면 서버 시간대(예: Asia/Seoul)
    timezone: ''

# 날씨 — 시간을 적지 않았을 때의 길이(초). 0 이면 바닐라처럼 무작위.
weather:
  default-duration: 0

# /바이옴찾기
find-biome:
  # 기본 반경(블록, /locate 와 같은 6400) · 최대 반경(-r: 상한)
  radius: 6400
  max-radius: 20000
  # 가로 간격(블록, /locate 와 같은 32)
  step: 32
  # 서버 전체 동시 찾기 수(사람마다 하나)
  max-concurrent: 2
  # 진행 표시 간격(초) · 한 번 찾기의 최대 시간(초)
  progress-every: 3
  max-seconds: 120
  # 깊은 어둠으로 보내면 경고
  deep-dark-warning: true

# /청크복구
fix-chunk:
  # 초당 검사 청크 수(Speed) · TPS 가 18 아래면 줄이기(AutoSpeed) · 진행 메시지(Messages)
  speed: 200
  auto-speed: true
  messages: true
  progress-every: 10

# /조명수정 — 한 번에 넘기는 청크 수 · 진행 표시 간격(초)
light-fix:
  batch: 16
  progress-every: 3

# /몹제거 — 기본 반경 · 최대 반경(-r: 상한)
kill-all:
  radius: 64
  max-radius: 512
