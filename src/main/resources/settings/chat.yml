# inmc-essentials — 채팅(chat) 기능 설정. /에센셜 리로드 로 다시 읽는다.
# 값이 이상하면 기본값으로 돈다. 지운 키는 이 배포 파일의 값으로 돈다.
# 채팅의 모양(이름·칭호·색)은 여기가 아니라 타이틀포지가 정한다 — 이 기능은 받는 사람·취소·글 내용만 고친다.
# 귓속말 받기·귓속말 소리·공개 채팅 끄기는 사람마다 /설정(플레이어 메뉴)에서 고른다.

private:
  # true: /답장 은 늘 마지막으로 내게 보낸 사람 (CMI ReplyToLastMessenger)
  # false: 아래 시간 안에 대화한 상대가 있으면 다른 사람이 보내도 그 상대에게 답한다
  reply-to-last-messenger: false
  # 위의 "대화 중" 으로 보는 시간(초) (CMI LastMessengerTimeOut)
  reply-timeout-seconds: 120
  # 뮤트된 사람은 귓속말·도움요청을 못 보낸다 (CMI Mute.DenyPrivateMessages). 편지는 settings/mail.yml letters.deny-when-muted
  # 그림자 뮤트는 이 값과 상관없이 늘 보낸 사람에게만 보낸 것처럼 보인다(받는 사람·운영진에게는 가지 않는다)
  deny-when-muted: true
  # 받는 사람의 그룹마다 inmcessentials.chat.msg.group.<그룹> 권한이 있어야 보낸다 (CMI PrivateMessagesGroups)
  # 받는 사람의 그룹 = order 에서 처음으로 group.<이름> 권한(LuckPerms 가 그룹원에게 준다)이 있는 것. 어느 것도 아니면 막지 않는다.
  groups:
    enabled: false
    order: []
  # 귓속말을 받을 때 소리(키:크기:높낮이). 비우면 소리 없음.
  sound: 'entity.experience_orb.pickup:0.6:1.6'
  # 귓속말·도움요청을 서버 로그에 남긴다
  log-to-console: true
  # 콘솔이 보낸 귓속말·편지의 이름
  console-name: '서버'
  # 귓속말·도움요청 한 번의 최대 글자 수
  max-length: 256

helpop:
  # true: 보낸 사람에게는 보낸 글 대신 "운영진에게 보냈습니다" 만 (CMI Optimizations.helpop.feedbackMessage)
  feedback-only: true

spy:
  # 명령 스파이에 보이지 않는 명령(비밀번호가 담기는 것). inmcessentials.chat.spy.bypass 권한이 있으면 보인다. (CMI Command.Spy.BlackListed)
  hidden-commands:
  - register
  - login
  - l
  # 비우면 모든 명령. 채우면 inmcessentials.chat.spy.all 권한이 없는 스파이는 이 명령만 본다. (CMI Command.Spy.CommandList)
  only-commands: []

ignore:
  # 무시한 사람의 공개 채팅도 내 화면에서 뺀다. false 면 /무시 는 귓속말·편지만 막는다 (CMI Chat.IgnorePublicMessage)
  public-chat: true

# 같은 말 도배 막기 (CMI ChatFilter.DuplicatedMessagePrevention — CMI 처럼 기본 꺼짐)
spam:
  enabled: false
  # 이만큼(%) 비슷하면 같은 말로 본다
  percentage: 80
  # 이 시간(초) 안의 글만 센다
  interval-seconds: 5
  # 같은 말을 이만큼 한 뒤의 글을 막는다(2 = 세 번째부터 막힘)
  min-amount: 2
  # 귓속말에도 적용
  include-private: true

# 거리 채팅과 외침 (CMI Settings/Chat.yml Ranged)
ranged:
  # 일반 채팅이 닿는 거리(블록). -1 = 제한 없음(모든 월드)
  general: -1
  # ! 로 시작한 외침이 닿는 거리. 0 = 모든 월드, -1 = 외침 끔. general 이 켜져 있을 때만 뜻이 있다.
  shout: 200
  # 외침 글의 기본 색(red · #ff8800). 비우면 그대로
  shout-color: ''
  # 외침 한 번의 비용(기본 화폐). 0 = 무료. inmcessentials.chat.shout.free 면 면제
  shout-cost: 0
  # 접속 인원에 따라 general 거리를 바꾼다. '인원-거리' — 인원이 그 이상이면 그 거리, 거리 0 = 제한 없음
  dynamic:
    enabled: false
    limits:
    - 1-0
    - 10-1000
    - 20-500
    - 30-400
    - 40-300
    - 50-200
  # 거리 안에 들은 사람이 없으면 보낸 사람에게 알린다
  notify-nobody: true

# 채팅·귓속말 속 주소를 [링크] 로 줄인다(누르면 열림). 디스코드에는 원래 주소가 간다. (CMI TranslateLink · LinkRegex)
link:
  enabled: true
  regex: '(^| )((http|https|ftp|ftps)\:\/\/)?[a-zA-Z0-9\-]+\.[a-zA-Z]{2,3}(\/\S*)?([^\s|^\)]+)'

# /타이틀 의 기본 시간(틱, 20틱 = 1초) — 명령에서 -in: -keep: -out: 으로 바꾼다
title:
  fade-in: 10
  stay: 70
  fade-out: 20
