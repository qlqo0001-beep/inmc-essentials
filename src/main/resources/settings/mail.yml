# inmc-essentials — 우편(mail) 기능 설정. /에센셜 리로드 로 다시 읽는다.
# 값이 이상하면 기본값으로 돈다. 지운 키는 이 배포 파일의 값으로 돈다.
# 이 우편함이 서버의 유일한 우편함이다 — 업적·낚시·숫자게임·커스텀아이템·urb·던전이 못 준 보상이 전부 여기로 온다(core Mail).

letters:
  # 편지 보관 일수(받은 때부터). 0 = 지우지 않음 (CMI Command.Mail.ExpiresIn)
  # 받을 것(첨부 아이템·돈)이 남은 편지는 지우지 않는다 — 다 받으면 그때부터 다시 이 일수
  expire-days: 30
  # 한 사람이 쥘 수 있는 편지 수. 0 = 제한 없음 (CMI MaxMails)
  max-per-player: 50
  # 편지함이 찼을 때 — refuse: 새 편지를 거절하고 보낸 사람에게 알림 · oldest: 받을 것이 없는 가장 오래된 편지를 지우고 넣기(CMI 방식)
  when-full: refuse
  # 편지 한 통의 최대 글자 수
  max-length: 500
  # 플레이어가 편지를 보낸 뒤 다음 편지까지(초). 콘솔·관리자(첨부·우편전체 권한)는 없음. 0 = 없음
  send-cooldown-seconds: 10
  # 한 사람이 한 받는 사람에게 쌓아 둘 수 있는 안 읽은 편지 수(편지 도배 막기). 콘솔·관리자는 없음. 0 = 제한 없음
  # 콘솔·관리자 편지는 편지함이 꽉 차도 들어간다(플레이어 편지 도배로 운영 공지·첨부가 막히지 않게)
  max-unread-per-sender: 5
  # 뮤트된 사람은 편지를 못 보낸다. 그림자 뮤트는 이 값과 상관없이 보낸 것처럼 보이고 넣지 않는다 (CMI Mute.DenyPrivateMessages)
  deny-when-muted: true

rewards:
  # 한 사람이 쥘 수 있는 보상 우편 수. 넘으면 새 보상을 받지 않고 콘솔에 경고한다(넣은 쪽이 바닥에 떨구거나 제 우편함에 둔다).
  # 보상 우편은 만료되지 않고 스스로 지우지도 않는다(사용자 결정). 0 = 제한 없음
  max-per-player: 500

mail-all:
  # /우편전체 — 최근 이 일수 안에 들어온 사람에게 (CMI mailAllDays)
  days: 7

# 콘솔이 보낸 편지의 보낸 사람 이름 (CMI ConsoleMailSender)
console-sender: '서버'

notify:
  # 접속하고 이만큼(틱) 뒤에 "안 읽은 편지 · 받을 것" 을 알린다
  join-delay-ticks: 40
  # 편지가 오거나 접속 알림 때 소리(키:크기:높낮이). 비우면 소리 없음
  sound: 'entity.experience_orb.pickup:0.7:1.2'
  # 보상이 우편으로 들어오면 액션바로 알린다
  reward-actionbar: true

# 우편 화면 아래 줄의 "다른 곳에서 받을 것" 바로가기(최대 2개). 그 플러그인이 켜져 있고 count(PAPI)가 숫자일 때만 보인다.
# 누르면 그 사람이 command 를 친다. 경매장 돈·만료 물건은 여러 서버 공용 DB 라 우편으로 옮기지 않는다.
shortcuts:
- name: '경매장 받을 돈'
  icon: GOLD_INGOT
  plugin: inmc-shop
  count: '%inmcshop_auction_unclaimed_listings%'
  command: '경매장 미수령'
- name: '경매장 만료 물건'
  icon: HOPPER
  plugin: inmc-shop
  count: '%inmcshop_auction_expired_listings%'
  command: '경매장 만료'
