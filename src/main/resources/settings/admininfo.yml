# inmc-essentials — 관리 정보(admininfo) 기능 설정. /에센셜 리로드 로 다시 읽는다.
# 값이 이상하면 기본값으로 돈다. 지운 키는 이 배포 파일의 값으로 돈다. 괄호 안은 옮겨 온 CMI 키.
# 기능 전체를 끄려면 config.yml 의 modules.admininfo: false (재시작).

vanish:
  # 사람마다 아직 바꾸지 않은 투명 옵션의 기본값(CMI Vanish.Defaults). /투명설정 으로 바꾼 사람은 그 값이 이긴다.
  defaults:
    damage-to-entity: false   # 남에게 피해 주기(damageToEntity)
    player-damage: false      # 피해 받기(playerDamage)
    item-pickup: false        # 아이템·화살·경험치 줍기(itemPickup)
    mob-aggro: false          # 몹이 노림(mobAggro)
    interaction: false        # 압력판·실·작물 밟기(interaction)
    inform-on-leave: false    # 투명인 채 나가도 퇴장 메시지(informOnLeave)
    inform-on-join: false     # 투명인 채 들어와도 접속 메시지(informOnJoin)
    night-vision: true        # 야간 투시(nightVision)
    bossbar: true             # '투명 상태' 보스바(bossbar)
    relog-disable: false      # 다시 접속하면 투명 풀기(relogDisable)
    no-messages: false        # 공개 채팅 막기(noMessages)
    fake-join-leave: false    # 켜고 끌 때 가짜 퇴장·접속 메시지(fakeJoinLeave)
    mob-spawning: false       # 주변 몹 자연 생성(mobSpawning)
    stop-playtime: true       # 플레이 시간 멈춤(stopPlaytime)
    sleep-ignore: true        # 잠자기 인원에서 빼기(sleepIgnore)
    join-vanished: false      # 늘 투명으로 접속(joinVanished)
    death-messages: false     # 죽음 메시지를 모두에게(deathMessages)
    hook-entities: false      # 낚싯대로 엔티티 끌기(hookPlayers)
  # 볼 권한(inmc.vanish.see)이 바뀐 사람에게 맞추는 주기(초)
  resync-seconds: 5
  # 투명을 켜고 끌 때 볼 권한이 있는 사람에게 한 줄 알림
  staff-notice: true

playtime:
  # 접속자의 바닐라 통계를 읽는 주기(초) — 하루별 기록·보상 진행이 이 간격으로 는다
  sample-seconds: 5
  # 사본·하루별 기록을 DB 에 쓰는 주기(초)
  flush-seconds: 60
  # 순위에서 뺄 이름(PlaytimeTopExclude)
  top-exclude: []
  # 이 날 수보다 오래 안 들어온 사람은 순위에서 뺀다. 0 = 안 뺌(PlaytimeTopOffline)
  top-offline-days: 0
  # 순위·최근 접속 한 쪽의 줄 수
  page-size: 10
  # 켤 때 사본이 없는 사람을 월드 통계 파일에서 채운다(비동기 — CMI 의 '데이터 훑기')
  scan-stats-on-start: true
  # 하루별 기록을 남기는 날 수(/상세플레이시간). 0 = 지우지 않음
  keep-days: 400

playtime-rewards:
  # 플레이 시간 보상 전체 켜고 끄기. 끄면 진행도 안 늘고 받을 수도 없다(/플레이보상 편집 은 된다).
  # CMI 의 Enabled 는 가져올 때 보상마다의 켜고 끄기로 옮긴다. 보상 자체는 /플레이보상 편집 에서 만든다.
  enabled: true
  # 반복 보상은 잠수 중인 시간을 세지 않는다(ExcludeAfk) — afk 기능이 켜져 있어야 뜻이 있다
  exclude-afk: false
  # 손으로 받는 보상이 남아 있으면 알리는 주기(분, RewardInform). 0 = 알리지 않음. 권한 inmcessentials.admininfo.prewards.notify
  inform-minutes: 15
  # 화면에 미리 보여 줄 '아직 안 닿은 한 번 보상' 개수(OneTimeAmount)
  one-time-shown: 2
  # 모든 보상에 권한 inmcessentials.admininfo.prewards.reward.<id> 가 필요(RequiresPermission). 보상마다 따로 켤 수도 있다
  require-permission: false

votes:
  # 투표 수를 센다(CountVotes). 끄면 수·누적 단계는 건너뛰고 알림·투표마다 보상은 그대로
  count: true
  # 한 아이피가 24시간 안에 할 수 있는 투표 수. 0 = 무제한(MaxVotesInADay)
  max-per-ip-per-day: 0
  # 같은 사이트에서 같은 사람의 투표 사이 최소 간격(초). 0 = 없음(GeneralCooldown)
  cooldown-seconds: 0
  # 투표마다 보상(PerformCommands) — 보상은 /투표편집 보상
  rewards: true
  # 누적 단계 보상(ExtraRewardsEnabled) — 단계마다 한 번, 그 수를 새로 지나는 투표에만
  milestones: true
  # 투표하면 서버에 알림(투명인 사람의 투표는 볼 수 있는 사람에게만)
  broadcast: true
  # 순위에서 뺄 이름(ExcludeList)
  top-exclude: []
  # /투표 의 '다음 투표까지' 계산에 쓰는 사이트 대기(시간). 0 = 안 보임
  site-hours: 24
  # 투표 기록을 남기는 날 수
  log-days: 30

list:
  # /목록 을 LuckPerms 주 그룹으로 묶는다(LuckPerms 가 없으면 한 줄)
  group-by-luckperms: true
  # 그룹 무게가 큰 것부터(ASCOrder 와 반대 뜻 — 높은 등급이 위)
  highest-weight-first: true

lastonline:
  # /최근접속 위에 보이는 "N 안에 몇 명"(초, Optimizations.Commands.lastonline.Timers)
  timers: [3600, 86400, 604800, 2592000]
