# inmc-essentials — 제재(moderation) 기능 설정. /에센셜 리로드 로 다시 읽는다.
# 값이 이상하면 기본값으로 돈다. 지운 키는 이 배포 파일의 값으로 돈다. 시간은 초.
# 명령 목록의 {player}·[playerName] 은 대상 이름, {reason}·{time} 은 사유·시간으로 바뀌고 콘솔이 실행한다(앞 / 는 없어도 된다).

ban:
  # 차단된 사람이 들어오려 할 때 바닐라 화면 대신 우리 문구(사유·남은 기간·차단한 사람) (CMI Ban.OverrideLoginMessage)
  override-login-message: true
  # 사유를 적지 않았을 때
  default-reason: '서버 규칙 위반'
  # 차단을 모두에게 알린다(끄면 운영진에게만 — inmcessentials.moderation.notify)
  broadcast: true
  # 기간밴의 최대 길이(초) — inmcessentials.moderation.tempban.max.<초> · .unlimited 권한이 없을 때. -1 = 제한 없음 (CMI 는 60)
  tempban-max-without-permission: 60
  commands:
    on-ban: []
    on-unban: []

kick:
  default-reason: '관리자에 의해 추방되었습니다'
  broadcast: true
  # 추방할 때마다
  commands: []

mute:
  default-reason: '채팅 규칙 위반'
  # 뮤트의 최대 길이(초) — …mute.max.<초> · .unlimited 권한이 없을 때. -1 = 제한 없음
  max-without-permission: -1
  # 뮤트 중에 막는 명령(채팅을 대신하는 바닐라 명령). 귓속말은 chat 기능이 접점으로 따로 막는다(chat 설정)
  blocked-commands:
  - me
  - say
  - teammsg
  - tm
  # 뮤트할 때마다(기간 바꾸기 +/- 는 빼고)
  commands: []

jail:
  # 시간을 적지 않았을 때 (CMI DefaultTime)
  default-time: 300
  # 최대 길이(초) — …jail.max.<초> · .unlimited 권한이 없을 때. -1 = 제한 없음
  max-without-permission: -1
  default-reason: '규칙 위반'
  # 갇힌 사람의 채팅이 들리는 거리(블록). 0 = 제한 없음 · -1 = 말할 수 없음 (CMI ChatRange)
  chat-range: 20
  # 나가 있는 동안에도 시간이 줄어든다 (CMI CountWhileOffline)
  count-while-offline: false
  # 잠수 중에는 시간이 멈춘다 (CMI NoAfk)
  no-afk: false
  # 갇힌 사람은 다치지 않는다(/kill·공허 빼고) · 배고프지 않다
  prevent-damage: true
  prevent-hunger: true
  # 갇힌 동안 쓸 수 있는 명령(첫 낱말 — 별칭까지 적는다. 여러 낱말이면 그 낱말들로 시작하는 것) (CMI WhiteListedCmds)
  whitelisted-commands:
  - 귓
  - msg
  - tell
  - w
  - m
  - whisper
  - 귓말
  - 귓속말
  - 답장
  - r
  - reply
  # 남은 시간을 보스바로 · 가둘 때 제목으로
  bossbar: true
  title: true
  # /감옥편집 만들기·영역 — WorldEdit 선택이 없으면 선 자리 둘레 이만큼(블록)
  stand-radius: 5
  commands:
    on-jail: []
    on-unjail: []

cuff:
  # 수갑을 찬 사람은 채팅도 못 한다 (CMI Cuff.Mute)
  mute: true
  # 수갑을 찬 동안 쓸 수 있는 명령 (CMI Cuff.AllowedCommands)
  allowed-commands:
  - 귓
  - msg
  - tell
  - w
  - m
  - 답장
  - r
  - reply

warnings:
  # 모두에게 알린다(끄면 운영진에게만)
  broadcast: true
  # 분류를 적지 않았을 때 (CMI Warnings.Default) — life-time 초(0 = 만료 없음), points 점수, reason 사유
  default:
    life-time: 86400
    points: 1
    reason: '서버 규칙 위반'
  # 분류 — 이름(한글·영문·숫자·_- · 32자)이 저장된다. aliases 는 명령에서 같이 받는 말 (CMI Warnings.Categories)
  categories:
    욕설:
      aliases: [swear]
      life-time: 86400
      points: 3
      reason: '욕설'
    테러:
      aliases: [grief]
      life-time: 86400
      points: 10
      reason: '테러(그리핑)'
    버그:
      aliases: [bug]
      life-time: 86400
      points: 30
      reason: '버그 악용'
    핵:
      aliases: [cheat]
      life-time: 86400
      points: 50
      reason: '불법 프로그램'
  # 살아 있는 경고의 점수 합이 이 수를 넘는 순간 실행 (CMI Warnings.Perform)
  perform:
    '3':
    - '뮤트 {player} 10m 경고 점수 3점 누적'
    '5':
    - '추방 {player} 경고 점수 5점 누적'
    '10':
    - '기간밴 {player} 5m 경고 점수 10점 누적'

alert:
  # /경보 추가 의 유지 시간(분) (CMI Alert.Timer)
  timer-minutes: 1440

notes:
  # 메모 보관 일수(쓴 때부터). 0 = 지우지 않음 (CMI Command.Notes.ExpiresIn)
  expire-days: 30
  # 경보가 걸린 사람이 들어오면 메모가 있다는 것도 알린다 (CMI Notes.ShowOnAlertEvent)
  show-on-alert: true

ip:
  # 들어오는 사람의 IP 를 기록한다(/부계정 · /아이피밴 플레이어) (CMI Optimizations.IP.Record)
  record: true
  # 0 = 접속 직전에 기록. 오프라인 서버라 로그인 플러그인 뒤에 기록하려면 들어온 뒤 이만큼(초) 지나서 (CMI delay)
  record-delay-seconds: 0
  # /부계정 에서 빼는 이름·IP (CMI Optimizations.Commands.CheckAccount.ExcludedUsers)
  checkaccount-excluded: []

data-tools:
  # 데이터 교환·유저 삭제·미접속 정리가 "사람" 으로 보는 열은 ess_ 표의 uuid · owner · player · …_uuid 열이다.
  # 다른 이름의 열은 '표.열' 로 더한다. 기본은 남이 그 사람을 가리키는 열 — 무시 목록의 대상 · 요청 차단의 대상.
  # 우편의 sender_id 는 넣지 않는다(지우면 그 사람이 남에게 보낸 우편까지 지운다).
  extra-columns:
  - ess_chat_ignores.target
  - ess_teleport_blocks.blocked
  # 아예 건드리지 않을 표
  exclude-tables: []

purge:
  # /미접속정리 의 기본 일수(마지막 접속이 이보다 오래된 사람) (CMI purge.OfflineDays)
  offline-days: 90
  # /미접속정리 … -파일 로 바닐라 파일까지 정리할 때 — false = <폴더>_backup 으로 옮김 · true = 지움 (CMI DeleteFiles)
  delete-files: false
  # 메인 월드 폴더 안의 폴더들 (playerdata · stats · advancements)
  folders:
  - playerdata
  - stats
  - advancements
