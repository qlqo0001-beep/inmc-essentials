# inmc-essentials — 이동(teleport) 기능 설정. /에센셜 리로드 로 다시 읽는다.
# 값이 이상하면 기본값으로 돈다. 지운 키는 이 배포 파일의 값으로 돈다.
# 명령 대기·쿨타임·비용은 여기가 아니라 commands 기능의 설정(명령 이름으로)에서 건다.

# 안전한 자리 — 도착지가 용암·허공·불·숨 막히는 블록이면 가까운 안전한 자리로 옮긴다(서바이벌·모험 모드만).
# 못 찾으면 이동하지 않는다(관리자 이동·감옥은 그대로 간다). 월드 경계 밖이면 경계 안으로 당긴다.
safe:
  enabled: true
  # true: 아래부터 찾고 다음에 위 · false: 위부터 찾고 다음에 아래 (CMI SafeLocationDownThenUp)
  down-then-up: false
  # 위아래로 찾는 블록 수
  vertical: 16
  # 옆으로 찾는 반지름(블록). 0 = 같은 기둥만
  horizontal: 2

# 이동 뒤 무적 — 이 플러그인으로 옮긴 뒤 N초(최대 60) 동안 피해를 받지 않는다. 0 = 끔.
invulnerability:
  seconds: 5
  # 월드별 초(이 월드로 옮겼을 때). 예) world_nether: 3  (CMI 의 목록 꼴 [world_nether-3] 도 읽는다)
  per-world: {}
  # 무적인 동안 남을 때리지도 못한다(CMI: 순간이동해 와서 기습하기 막기)
  no-attack: true
  # 블록을 놓거나 부수면 무적이 바로 풀린다
  end-on-block: true
  # 블록·엔티티를 우클릭/좌클릭으로 건드리면 무적이 바로 풀린다
  end-on-interact: true

tp:
  # true: /이동 <누구> <어디로>  · false: /이동 <어디로> <누구>
  switch-places: true
  # 나가 있는 동안 /소환·/월드전원소환 된 자리 — 이 초가 지나도록 접속하지 않으면 버린다(0 = 끝없음). 기본 7일
  pending-expire-seconds: 604800
  # /월드전원소환 이 다음 접속 때 옮길 나간 사람 — 최근 이 일 수 안에 나간 사람만(0 = 전부)
  tpallworld-offline-days: 30

# 이동 요청(/이동요청 · /소환요청 · /전원소환요청)
tpa:
  # 수락을 기다리는 초
  expire-seconds: 60
  # 수락 뒤 옮겨지기까지 초(0 = 바로)
  warmup-seconds: 3
  # 기다리는 동안 움직이면 취소
  cancel-on-move: true
  # 거절당한 사람이 같은 상대에게 다시 요청하지 못하는 초(0 = 막지 않음)
  deny-block-seconds: 120
  # 요청할 수 있는 최대 거리(블록). 0 = 제한 없음. 0 보다 크면 다른 월드에도 요청할 수 없다.
  # inmcessentials.teleport.tpa.nodistance 권한이 있으면 무시
  max-distance: 0
  here-max-distance: 0
  # 이동요청: true 면 수락한 순간 상대가 있는 자리로 · false 면 요청한 때 상대가 있던 자리로
  current-location: true
  # 소환요청: true 면 수락한 순간 요청한 사람이 있는 자리로 · false 면 요청한 때의 자리로
  here-current-location: true
  # 요청 메시지에 [수락] [거절] 버튼(요청한 사람에게는 [취소] 버튼)
  buttons: true
  # 요청을 받은 사람에게 들리는 소리(비우면 없음)
  request-sound: 'block.anvil.land:0.5:2'
  # 처음 온 사람의 요청 받기 기본값(/요청차단 으로 각자 바꾼다)
  default-accepting: true
  # 이 월드에 있는 사람은 요청을 보내지도 받지도 못하고, 이 월드로는 요청으로 갈 수 없다(던전 — 판·입장료 없이 들어가지 않게)
  excluded-worlds:
  - inmc_dungeon

# 뒤로(/뒤로) — 이동하기 전 자리를 기억한다
back:
  # 기록할 이동 원인: COMMAND(바닐라 /tp 등) PLUGIN(플러그인 이동) UNKNOWN NETHER_PORTAL END_PORTAL END_GATEWAY ENDER_PEARL CHORUS_FRUIT SPECTATE ...
  # 포탈은 걸어서 되돌아갈 수 있어 기본에서 뺐다.
  causes:
  - COMMAND
  - PLUGIN
  - UNKNOWN
  # 이 거리(블록)보다 가까운 같은 월드 안 이동은 기록하지 않는다
  min-distance: 5.0
  # 이 월드에서 떠날 때는 기록하지 않고, 이 월드로는 /뒤로 할 수 없다(던전 월드는 재시작 때 지워진다)
  excluded-worlds:
  - inmc_dungeon
  # 기록이 이 초가 지나면 못 쓴다(0 = 끝없음)
  expire-seconds: 0
  # /뒤로 로 옮긴 것도 기록할지(true 면 /뒤로 를 두 번 치면 두 자리를 오간다)
  record-back-moves: false

# 사망 지점(/사망지점)
death-back:
  excluded-worlds:
  - inmc_dungeon
  expire-seconds: 0

# 이동 금지 아이템 — 들고 있으면 이동이 막힌다. inmcessentials.teleport.blacklist.bypass 권한이 있으면 무시.
blacklisted-items:
  enabled: false
  # 막을 이동 종류: TP(/이동·/좌표이동 으로 하는 자기 이동) TPA HOME WARP SPAWN BACK DEATH_BACK PORTAL BIOME
  # (ADMIN·JAIL·OTHER 는 적어도 막지 않는다 — OTHER 는 토템 구조·앉기·접속 복귀 같은 다른 기능의 시스템 이동)
  # BACK·DEATH_BACK 을 빼면 /뒤로·/사망지점 이 금지 아이템을 옮기는 길이 된다
  kinds:
  - TP
  - TPA
  - HOME
  - WARP
  - SPAWN
  - BACK
  - DEATH_BACK
  # 아이템:최대개수 (개수를 빼면 0 — 하나라도 있으면 막힘). 아이템은 바닐라 이름 · mmoitems:종류:ID · 커스텀아이템 이름공간:ID
  # {item: '...', max: 3} 모양도 된다.
  items:
  - diamond
  - diamond_block
  - diamond_ore
  - iron_ore:5

# 이동 종류마다 효과. from = 떠난 자리 파티클, to = 도착 자리 파티클(이름:개수, 예 portal:40), sound = 도착 소리(키:크기:높낮이)
# 종류: HOME WARP SPAWN TPA BACK DEATH_BACK ADMIN PORTAL JAIL BIOME OTHER
# 이 기능의 명령마다(있으면 종류보다 먼저 — CMI TeleportEffects 와 같은 이름):
#   TP(/이동·/강제이동·/이동 A B) TPHERE(/소환·/강제소환·/소환 A B) TPALL(/전원소환·/월드전원소환) TPAALL(/전원소환요청 수락) TPPOS(/좌표이동) TPOPOS(/강제좌표이동)
effects:
  HOME:
    sound: 'block.beacon.activate:2.0:1.0'
  WARP:
    sound: 'entity.enderman.teleport:0.5:1.0'
  SPAWN:
    sound: 'entity.enderman.teleport:0.5:1.0'

# 이동이 막혔을 때(금지 아이템·안전한 자리 없음) 소리
fail-sound: 'entity.villager.no:2.0:1.0'
