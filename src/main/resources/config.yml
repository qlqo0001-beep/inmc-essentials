# inmc-essentials 설정. 기능마다의 설정은 settings/<기능>.yml, 메시지는 messages/<기능>.yml 에 있다.
# /에센셜 리로드 로 다시 읽는다 — 단 storage 와 modules 는 서버를 다시 켜야 바뀐다.

storage:
  # sqlite = 이 서버의 plugins/inmc-essentials/data/essentials.db
  # mysql  = 여러 서버가 같이 쓰는 DB(아래 url 을 비우면 sqlite 로 돈다)
  type: sqlite
  mysql:
    url: ''          # 예: jdbc:mysql://127.0.0.1:3306/inmc?useSSL=false&characterEncoding=utf8
    user: ''
    password: ''

# 기능 켜고 끄기. 끈 기능은 명령·리스너가 하나도 없다(DB 표만 만든다).
modules:
  teleport: true
  homes: true
  warps: true
  spawn: true
  chat: true
  mail: true
  player: true
  afk: true
  items: true
  inventory: true
  kits: true
  world: true
  decor: true
  portals: true
  holograms: true
  commands: true
  server: true
  moderation: true
  admininfo: true

# 보상(킷·플레이 시간 보상·투표 보상)이 쓰는 core 보상·우편함.
rewards:
  # 가방이 차면 바닥에 떨굴지(false 면 우편으로 — 단 우편 기능(modules.mail)이 꺼져 있으면 바닥에).
  drop-when-full: false
  # 이 플러그인 몫의 우편함이 한 사람에게 쥘 수 있는 개수(우편 기능이 켜져 있으면 우편 기능이 맡는다).
  mailbox-limit: 200
  # 받지 않은 보상을 지우기까지(초). 0 = 지우지 않는다.
  mailbox-expire-seconds: 0
  # 보상 아이템 중 '공지' 로 표시한 것을 전체에 알릴지.
  broadcast: true
  # 지난 시즌 기록 보관 개수.
  season-archive-limit: 10
