# inmc-essentials — server 기능의 메시지(서버 상태·점검·서버 목록·텍스트·책·플레이스홀더·데이터 이전·CMI 가져오기).
# 키는 전부 "server-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# 플레이스홀더 안내의 ％ 는 일부러 넓은 글자다 — 보통 % 를 쓰면 메시지를 보낼 때 PlaceholderAPI 가 풀어 버린다.
