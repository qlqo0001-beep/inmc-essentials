# inmc-essentials — kits 기능의 메시지(킷).
# 키는 전부 "kits-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
kits-none: '<gray>받을 수 있는 킷이 없습니다.</gray>'
kits-list-header: '<gold>킷 {개수}개</gold> <gray>(눌러서 받기)</gray>'
kits-list-entry: '<click:run_command:''/킷 {값}''><hover:show_text:''<gray>/킷 {값}</gray>''><white>{이름}</white></hover></click> <gray>{상태}</gray>'
kits-state-ready: '<green>받기</green>'
kits-state-locked: '<red>잠김</red>'
kits-unknown: '<red>그런 킷이 없습니다: {값}</red>'
kits-received: '<green>킷 <white>{이름}</white> 을(를) 받았습니다.</green> <gray>{아이템}</gray>'
kits-given: '<green>{플레이어}님에게 킷 <white>{이름}</white> 을(를) 줬습니다.</green>'
kits-mailed: '<yellow>받는 사람이 접속 중이 아니라 킷 {이름} 을(를) 우편으로 보냈습니다.</yellow>'
kits-unresolved: '<yellow>만들 수 없는 보상 {개수}개를 건너뛰었습니다(그 아이템의 플러그인이 없음).</yellow>'
kits-failed: '<red>킷 {이름} 기록을 쓰지 못해 주지 않았습니다(비용은 돌려줬습니다) — 서버 로그를 보세요.</red>'
kits-denied-permission: '<red>킷 {이름} 을(를) 받을 권한이 없습니다.</red>'
kits-denied-superseded: '<red>킷 {이름} 대신 같은 그룹의 더 높은 킷을 받을 수 있습니다.</red>'
kits-denied-condition: '<red>킷 {이름} 을(를) 받으려면 조건이 필요합니다: {값}</red>'
kits-denied-cooldown: '<red>킷 {이름} 은(는) {시간} 뒤에 받을 수 있습니다.</red>'
kits-denied-used-up: '<red>킷 {이름} 은(는) 이미 받을 만큼 받았습니다.</red>'
kits-denied-money: '<red>킷 {이름} 을(를) 받으려면 {금액}이(가) 필요합니다.</red>'
kits-denied-exp: '<red>킷 {이름} 을(를) 받으려면 경험치 {개수}점이 필요합니다.</red>'
kits-denied-empty: '<red>킷 {이름} 이(가) 비어 있습니다.</red>'
kits-denied-busy: '<gray>킷 {이름} 을(를) 주는 중입니다…</gray>'
kits-preview-denied: '<red>이 킷은 미리볼 수 없습니다.</red>'
kits-reset-usage: '<yellow>/킷초기화 [킷|all] [플레이어|all] [쿨타임|횟수]</yellow> <gray>— 셋째를 비우면 쿨타임과 횟수를 모두 되돌립니다</gray>'
kits-reset-done: '<green>킷 {값} · {플레이어} 의 기록 {개수}줄을 되돌렸습니다.</green>'
