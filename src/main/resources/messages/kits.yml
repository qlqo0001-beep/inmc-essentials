kits-created: '<green>킷 {값} 을(를) 만들었습니다.</green>'
kits-removed: '<green>킷 {값} 을(를) 지웠습니다.</green>'
kits-renamed: '<green>킷 id 를 {값} → {새id} 로 바꿨습니다(사용 기록도 옮김).</green> <gray>권한은 이제 {권한} — LuckPerms 등의 옛 노드를 고치세요</gray>'
