# inmc-essentials — chat 기능의 메시지(귓속말·답장·무시·도움요청·스태프·스파이·공지·타이틀·채팅 다듬기).
# 키는 전부 "chat-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# {메시지} 자리에는 사람이 친 글이 따로 끼워진다(틀의 MiniMessage·PAPI 를 거치지 않는다). {실명} = 클릭 명령용 진짜 이름.

chat-msg-to: '<gray>[<white>나</white> <dark_gray>→</dark_gray> <click:suggest_command:''/귓 {대상실명} ''><hover:show_text:''<gray>눌러서 다시 보내기</gray>''><yellow>{대상}</yellow></hover></click>]</gray> <white>{메시지}</white>'
chat-msg-from: '<gray>[<click:suggest_command:''/귓 {실명} ''><hover:show_text:''<gray>눌러서 답장</gray>''><yellow>{플레이어}</yellow></hover></click> <dark_gray>→</dark_gray> <white>나</white>]</gray> <white>{메시지}</white>'
chat-msg-clean: '<white>{메시지}</white>'
chat-msg-usage: '<yellow>/귓 [플레이어] [내용]</yellow> <gray>- 귓속말 · /답장 [내용]</gray>'
