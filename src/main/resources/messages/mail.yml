  <gold>/우편 비우기 [플레이어] 전체 확인</gold> <gray>- 보상까지 전부(되돌릴 수 없음)</gray>
  <gold>/우편전체 [내용]</gold> <gray>- 최근 접속한 모두에게 · </gray><gold>/우편전체 회수</gold> <gray>- 마지막 것 거두기</gray>
