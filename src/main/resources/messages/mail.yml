  <gold>/우편 임시 [플레이어] [기간] [내용]</gold> <gray>- 기간 뒤 지워지는 편지(1d · 12h)</gray>
  <gold>/우편 지우기 [번호|읽은것|전체]</gold> <gray>- 편지 지우기(보상은 안 지워짐)</gray>
