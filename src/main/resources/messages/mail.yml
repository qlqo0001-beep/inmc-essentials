# inmc-essentials — mail 기능의 메시지(우편함 — core Mail 공급처 · 편지).
# 키는 전부 "mail-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# 보상을 돈을 못 줘 남겼다는 안내는 공통 키 mailbox-money-held(common.yml).

mail-menu-title: '<dark_gray>우편함</dark_gray>'
mail-menu-title-other: '<dark_gray>{플레이어}님의 우편함</dark_gray>'
mail-book-header: '<dark_gray>보낸 사람:</dark_gray> <black>{보낸사람}</black><newline><dark_gray>{날짜}</dark_gray><newline>'
mail-book-attachment: '<dark_gray>이 편지에는 받을 것이 붙어 있습니다.</dark_gray><newline><newline><black>/우편</black> <dark_gray>화면에서 우클릭으로 받으세요.</dark_gray>'
mail-source-letter: '{플레이어}님의 편지'
mail-attach-default-text: '선물입니다.'
mail-join: '<click:run_command:''/우편''><hover:show_text:''<gray>눌러서 우편함 열기</gray>''><gold>✉</gold> <yellow>안 읽은 편지 {개수}통 · 받을 것 {받을것}통이 있습니다.</yellow> <gray>/우편</gray></hover></click>'
mail-letter-arrived: '<click:run_command:''/우편''><hover:show_text:''<gray>눌러서 우편함 열기</gray>''><gold>✉</gold> <yellow>{플레이어}님의 편지가 왔습니다.</yellow> <gray>/우편</gray></hover></click>'
mail-reward-arrived: '<gold>✉</gold> <yellow>우편함에 보상이 들어왔습니다</yellow> <gray>({이름}) · /우편</gray>'
mail-claimed: '<green>우편 {개수}통을 받았습니다.</green>'
mail-claimed-one: '<green>받았습니다.</green>'
mail-claimed-partial: '<yellow>{개수}통을 받았습니다. 가방이 모자라 {금액}통은 남겨 두었습니다.</yellow>'
