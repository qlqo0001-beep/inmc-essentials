mail-usage: |-
  <gold>/우편</gold> <gray>- 우편함 화면</gray>
  <gold>/우편 받기</gold> <gray>- 전부 받기</gray>
  <gold>/우편 읽기 [번호]</gold> <gray>- 편지 목록 · 읽기</gray>
