# inmc-essentials — inventory 기능의 메시지(인벤·엔더 보기·저장·조용히 열기).
# 키는 전부 "inventory-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
