# inmc-essentials — moderation 기능의 메시지(밴·추방·뮤트·채팅 잠금·감옥·경고·수갑·경보·메모·계정 조회·IP 잠금·순찰·대신 실행·유저 메타·데이터 도구).
# 키는 전부 "moderation-" 로 시작하고, 코드의 messageDefaults(ModMessages.kt) 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# 기능만의 토큰: {관리자} {감옥} {감방} {분류} {점수} {번호} {키} {아이피} {명령} {목록} {날짜} {표} {열}

