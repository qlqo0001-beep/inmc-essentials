# inmc-essentials — teleport 기능의 메시지(이동·순간이동 요청·뒤로).
# 키는 전부 "teleport-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# 자리표시: {플레이어} {대상} {값} {개수} {월드} {시간} {사유} · 금지 아이템: {목록}(마우스 올림) · 목록 한 줄: {아이템} {개수} {최대}
# 월드전원소환: {나간사람} = 다음 접속 때 옮겨질 나간 사람 수

teleport-someone: '관리자'
