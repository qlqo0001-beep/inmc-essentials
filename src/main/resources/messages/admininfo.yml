# inmc-essentials — admininfo 기능의 메시지(투명·플레이 시간·투표·정보).
# 키는 전부 "admininfo-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# 기능만의 토큰: {순번} {닉네임} {그룹} {접두} {시간제비행} {시간제무적} {uuid} {핑} {사이트} {오늘} {쪽} {전체쪽} {전} {후} {하위} {투명수} {x} {y} {z} …(줄마다 쓰는 것만 바뀐다)

