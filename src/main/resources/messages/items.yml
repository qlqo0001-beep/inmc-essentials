# inmc-essentials — items 기능의 메시지(아이템 지급·편집·가상 작업대·셜커 배낭·비우기·염색·검색).
# 키는 전부 "items-" 로 시작하고, 코드의 messageDefaults 와 정확히 같아야 한다(ResourceTest).
# 비운 값('')은 그 메시지를 끈다. 지운 키는 코드의 기본값으로 돈다.
# 지급
items-give-usage: '<yellow>/지급 [대상] [아이템…] [개수]</yellow> <gray>— 대상: 이름 · * (접속자) · ** (최근 접속자, 오프라인은 우편). 아이템: diamond · inmc:[id] · mmoitems:[종류]:[id] · hand · hand:[사람] · inv:[사람]. 꼬리: n{이름} l{줄|줄} e{sharpness:5} unbreakable -s -slot:[칸] -d:[일]</gray>'
items-giveall-usage: '<yellow>/전원지급 [아이템…] [개수] [offline]</yellow> <gray>— 접속자 전원(offline 을 붙이면 최근 접속자 전원, 오프라인은 우편)</gray>'
items-spec-unclosed: '<red>괄호 {…} 가 닫히지 않았습니다.</red>'
items-spec-slot: '<red>칸 번호가 이상합니다: {값}</red> <gray>(-slot:0~40)</gray>'
items-spec-days: '<red>기간이 이상합니다: {값}</red> <gray>(-d:1~3650)</gray>'
items-spec-enchant: '<red>인챈트를 읽지 못했습니다: {값}</red> <gray>(e{sharpness:5,unbreaking:3})</gray>'
items-spec-amount: '<red>개수가 이상합니다: {값}</red> <gray>(아이템 뒤에 숫자 하나)</gray>'
items-spec-flag: '<red>모르는 옵션입니다: {값}</red>'
items-spec-no-item: '<red>줄 아이템을 적으세요.</red>'
items-amount-too-large: '<red>한 번에 {개수}개까지 줄 수 있습니다.</red>'
items-unknown-item: '<red>만들 수 없는 아이템입니다: {값}</red> <gray>(재질 · inmc:[id] · mmoitems:[종류]:[id] · 네임스페이스:[id])</gray>'
items-unknown-enchant: '<red>모르는 인챈트입니다: {값}</red>'
